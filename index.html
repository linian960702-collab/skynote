<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>Sticky Notes Board</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17223b;background:#f5f7fb;font-size:16px}*{box-sizing:border-box}body{margin:0;min-height:100vh}button,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1190px;margin:auto;padding:46px 30px 90px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:36px}.eyebrow{font-size:.82rem;font-weight:750;text-transform:uppercase;letter-spacing:.15em;color:#6677a1;margin:0 0 9px}h1{font-size:clamp(2rem,4vw,3.1rem);letter-spacing:-.055em;line-height:1.08;margin:0}.sub{color:#637087;margin:11px 0 0;line-height:1.5}.count{border:1px solid #dce3ef;background:white;padding:9px 14px;border-radius:999px;font-size:.88rem;color:#526078;white-space:nowrap;box-shadow:0 4px 15px #21335808}.workspace{display:grid;grid-template-columns:290px minmax(0,1fr);gap:28px;align-items:start}.composer{background:white;border:1px solid #e2e7ef;border-radius:20px;padding:21px;box-shadow:0 12px 34px #2030520b;position:sticky;top:24px}.composer h2,.board-head h2{font-size:1.02rem;letter-spacing:-.02em;margin:0 0 15px}.composer textarea{width:100%;min-height:155px;resize:vertical;padding:15px;border:1px solid #dbe2ee;border-radius:13px;outline:none;color:#17223b;line-height:1.5;background:#fbfcff}.composer textarea:focus,.edit-area:focus{border-color:#596bd6;box-shadow:0 0 0 3px #596bd622}.composer textarea::placeholder{color:#96a0b1}.hint{font-size:.78rem;color:#8190a4;margin:9px 0 17px}.primary{border:0;background:#465bd0;color:#fff;font-weight:700;border-radius:11px;padding:12px 16px;width:100%;box-shadow:0 7px 14px #465bd02c}.primary:hover{background:#3549b9}.primary:focus-visible,button:focus-visible{outline:3px solid #8698ff;outline-offset:2px}.board-head{display:flex;justify-content:space-between;align-items:baseline;margin:3px 0 17px}.board-head h2{font-size:1.12rem;margin:0}.board-head span{color:#8b95a5;font-size:.84rem}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:17px;align-items:stretch}.note{--note:#fff2c6;background:var(--note);border:1px solid #17223b0d;border-radius:17px;min-height:220px;padding:20px;display:flex;flex-direction:column;box-shadow:0 8px 18px #2939570d;transition:transform .16s,box-shadow .16s;overflow-wrap:anywhere}.note:hover{transform:translateY(-3px);box-shadow:0 15px 27px #29395718}.note:nth-child(4n+2){--note:#dff1ed}.note:nth-child(4n+3){--note:#e8e6ff}.note:nth-child(4n+4){--note:#ffe6e2}.note-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:18px}.pin{width:9px;height:9px;border-radius:50%;background:#17223b5c;box-shadow:0 2px 3px #17223b25}.date{font-size:.78rem;color:#596375}.note-text{white-space:pre-wrap;line-height:1.52;font-size:1rem;margin:0 0 18px;flex:1}.note.done .note-text{text-decoration:line-through;color:#697387}.note.done{opacity:.68}.actions{display:flex;gap:5px;flex-wrap:wrap;margin:0 -7px -6px}.action{border:0;background:transparent;color:#4d5a72;border-radius:8px;font-size:.78rem;font-weight:700;padding:7px}.action:hover{background:#ffffffa8;color:#1d2c50}.action.delete:hover{color:#a92d43}.edit-area{width:100%;min-height:115px;resize:vertical;border:1px solid #bac6d5;border-radius:9px;padding:10px;background:#ffffffb8;color:#17223b;line-height:1.5;margin-bottom:12px;outline:none}.empty{border:1px dashed #cad4e3;border-radius:20px;min-height:260px;display:grid;place-content:center;text-align:center;padding:28px;color:#65728a;background:#ffffff75}.empty-icon{font-size:2rem;margin-bottom:12px}.empty strong{color:#24314b;font-size:1.1rem}.empty p{margin:7px 0 0}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:720px){.shell{padding:30px 18px 65px}.top{margin-bottom:25px}.workspace{grid-template-columns:1fr;gap:28px}.composer{position:static}.composer textarea{min-height:95px}.grid{grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:12px}.note{min-height:190px;padding:16px}}@media(max-width:430px){.top{align-items:flex-end}.count{font-size:.76rem;padding:7px 10px}.grid{grid-template-columns:1fr}.note{min-height:160px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div><p class="eyebrow">Your space to think</p><h1>Sticky notes</h1><p class="sub">Capture a thought. Come back to it anytime.</p></div><span class="count" id="count">0 notes</span></header>
    <div class="workspace">
      <section class="composer" aria-labelledby="new-heading"><h2 id="new-heading">New note</h2><form id="add-form"><label class="sr-only" for="new-text">Note text</label><textarea id="new-text" maxlength="2000" placeholder="What’s on your mind?" required></textarea><p class="hint">Your notes are saved in this browser.</p><button class="primary" type="submit">+ Add note</button></form></section>
      <section aria-labelledby="board-heading"><div class="board-head"><h2 id="board-heading">Your board</h2><span id="active-count"></span></div><div id="board" class="grid" aria-live="polite"></div></section>
    </div>
  </main>
  <script>
    (()=>{
      'use strict';
      const KEY='sticky-notes-board-v1';
      const board=document.getElementById('board');
      const form=document.getElementById('add-form');
      const input=document.getElementById('new-text');
      const count=document.getElementById('count');
      const activeCount=document.getElementById('active-count');
      let notes=[];
      try{const data=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(data))notes=data.filter(n=>n&&typeof n.id==='string'&&typeof n.text==='string').map(n=>({id:n.id,text:n.text,done:!!n.done,created:Number(n.created)||Date.now()}));}catch(e){notes=[];}
      function save(){try{localStorage.setItem(KEY,JSON.stringify(notes));}catch(e){alert('Could not save notes in this browser. Check your available storage.');}}
      function action(label,kind){const b=document.createElement('button');b.type='button';b.className='action '+kind;b.textContent=label;return b;}
      function render(){
        board.replaceChildren();count.textContent=`${notes.length} ${notes.length===1?'note':'notes'}`;
        const active=notes.filter(n=>!n.done).length;activeCount.textContent=notes.length?`${active} open`:'';
        if(!notes.length){const empty=document.createElement('div');empty.className='empty';empty.innerHTML='<div class="empty-icon" aria-hidden="true">✎</div><strong>A fresh start</strong><p>Add your first note to fill this space.</p>';board.append(empty);return;}
        for(const note of notes){
          const card=document.createElement('article');card.className='note'+(note.done?' done':'');
          const top=document.createElement('div');top.className='note-top';const pin=document.createElement('span');pin.className='pin';pin.setAttribute('aria-hidden','true');const date=document.createElement('span');date.className='date';date.textContent=new Date(note.created).toLocaleDateString(undefined,{month:'short',day:'numeric'});top.append(pin,date);
          const body=document.createElement('p');body.className='note-text';body.textContent=note.text;
          const actions=document.createElement('div');actions.className='actions';
          const toggle=action(note.done?'Reopen':'Complete','toggle');toggle.setAttribute('aria-label',(note.done?'Reopen':'Complete')+' note: '+note.text.slice(0,50));toggle.addEventListener('click',()=>{note.done=!note.done;save();render();});
          const edit=action('Edit','edit');edit.setAttribute('aria-label','Edit note: '+note.text.slice(0,50));edit.addEventListener('click',()=>editNote(card,note));
          const del=action('Delete','delete');del.setAttribute('aria-label','Delete note: '+note.text.slice(0,50));del.addEventListener('click',()=>{notes=notes.filter(n=>n.id!==note.id);save();render();});
          actions.append(toggle,edit,del);card.append(top,body,actions);board.append(card);
        }
      }
      function editNote(card,note){
        const body=card.querySelector('.note-text');const actions=card.querySelector('.actions');
        const field=document.createElement('textarea');field.className='edit-area';field.maxLength=2000;field.setAttribute('aria-label','Edit note text');field.value=note.text;
        const saveButton=action('Save','save');const cancel=action('Cancel','cancel');
        const finish=()=>{const value=field.value.trim();if(!value){field.focus();return;}note.text=value;save();render();};
        saveButton.addEventListener('click',finish);cancel.addEventListener('click',render);
        field.addEventListener('keydown',e=>{if(e.key==='Escape')render();if((e.ctrlKey||e.metaKey)&&e.key==='Enter')finish();});
        body.replaceWith(field);actions.replaceChildren(saveButton,cancel);field.focus();field.setSelectionRange(field.value.length,field.value.length);
      }
      form.addEventListener('submit',e=>{e.preventDefault();const text=input.value.trim();if(!text)return;notes.unshift({id:globalThis.crypto?.randomUUID?.()||`${Date.now()}-${Math.random()}`,text,done:false,created:Date.now()});save();render();form.reset();input.focus();});
      render();
    })();
  </script>
</body>
</html>
